name: Build checks

on:
  push:
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  frontend-build:
    name: Frontend compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - name: Compile the full frontend
        run: npm run build

  server-syntax:
    name: Server syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check server modules without starting them
        run: npm run check:server